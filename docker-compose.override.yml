services:
  catalogdb:
    container_name: catalogdb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
  basketdb:
      container_name: basketdb
      restart: always
      ports:
        - "6379:6379"
  
  catalog:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "MongoDBSettings__ConnectionString=mongodb://catalogdb:27017"
      - "MongoDBSettings__DatabaseName=CatalogDb"
      - "MongoDBSettings__ProductCollectionName=Products"
      - "MongoDBSettings__BrandCollectionName=Brands"
      - "MongoDBSettings__TypeCollectionName=Types" 
    depends_on:
      - catalogdb          
    ports:
      - "8000:8080"
  basket:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "CacheSettings__ConnectionString=basketdb:6379"      
    depends_on:
      - basketdb
    ports:
      - "8001:8080"